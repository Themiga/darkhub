<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DarkHub — Authenticating...</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <meta name="robots" content="noindex, nofollow" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <span class="logo">Dark<span class="accent">Hub</span></span>
    <div id="auth-status" class="auth-status">
      <div class="spinner"></div>
      <p>Authenticating with GitHub...</p>
    </div>
  </div>

  <script>
    // This page is the OAuth callback redirect target.
    // It exchanges the code+state via the Worker and stores the JWT.
    (async () => {
      const statusEl = document.getElementById('auth-status');

      function showError(msg) {
        statusEl.innerHTML = `
          <div class="auth-error">
            <span class="auth-icon">✗</span>
            <p>${msg}</p>
            <a href="../admin/" class="btn-primary" style="margin-top:1rem">Back to Login</a>
          </div>`;
      }

      try {
        const params = new URLSearchParams(window.location.search);
        const code  = params.get('code');
        const state = params.get('state');

        if (!code || !state) {
          showError('Missing OAuth parameters.');
          return;
        }

        // Forward code+state to the Worker callback handler
        const WORKER = '__WORKER_ORIGIN__'; // replaced at deploy time by sed/CI
        const res = await fetch(`${WORKER}/api/auth/callback?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state)}`, {
          credentials: 'omit',
        });

        if (!res.ok) {
          // Non-admin or error — show blocked message
          showError('You are not welcome in this area.');
          return;
        }

        const data = await res.json();
        if (!data.token) {
          showError('Authentication failed.');
          return;
        }

        // Store JWT in sessionStorage only (cleared when tab closes)
        sessionStorage.setItem('dh_token', data.token);

        // Redirect to admin panel
        statusEl.innerHTML = `
          <div class="auth-success">
            <span class="auth-icon success">✔</span>
            <p>Welcome, <strong>${data.user.login}</strong>! Redirecting...</p>
          </div>`;

        setTimeout(() => { window.location.href = '../admin/'; }, 800);

      } catch (err) {
        showError('Network error. Please try again.');
      }
    })();
  </script>
</body>
</html>
